<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Set the theme before any CSS loads so a dark page never flashes light (see src/lib/theme.js).
      ;(function () {
        var theme = null
        try {
          theme = window.localStorage.getItem('marka-theme')
        } catch (error) {
          theme = null
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
    <title>Marka</title>
    <meta
      name="description"
      content="Marka checks paper answer sheets with your phone and turns the results into item analysis and least mastered skills for teachers and principals."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Marka" />
    <meta property="og:title" content="Marka" />
    <meta
      property="og:description"
      content="Marka checks paper answer sheets with your phone and turns the results into item analysis and least mastered skills for teachers and principals."
    />
    <meta property="og:url" content="https://performance-analytic-assessment-system.onrender.com/" />
    <meta property="og:image" content="https://performance-analytic-assessment-system.onrender.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
